services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: structflow
      POSTGRES_PASSWORD: structflow
      POSTGRES_DB: structflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U structflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://structflow:structflow@db:5432/structflow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  # Nightly reprice. Run on a schedule from the host or an orchestrator:
  #   docker compose run --rm batch
  batch:
    profiles: ["batch"]
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://structflow:structflow@db:5432/structflow
    depends_on:
      db:
        condition: service_healthy
    command: ["structflow", "reprice"]

volumes:
  pgdata:
